# Real-prompt set: change requests and bug reports for eval/corpora, written the
# way agents receive them. Short, vague, sometimes a pasted trace, and mostly
# without the code's own words. The hand-written queries beside this file read
# like search queries. These don't, which is the point.
#
# Schema:
#   corpus  - a directory under eval/corpora/
#   kind    - change | bug
#   prompt  - the raw text
#   files   - paths the work belongs in; any one in the top results counts
#
# `vexus-eval prompts` scores these through Store::locate, the code behind the
# prompt hook. It's an advisory report and never gates anything.

