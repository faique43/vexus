# Schema: see eval/queries/pyapp.yaml's header comment. Every qualname below
# was read back from a real `vexus index` run over this corpus
# (VEXUS_EMBEDDER=mock) — see crates/vexus-cli/tests/eval_corpora_validation.rs.

# --- explore: how-does-X-work -----------------------------------------

- q: "how does order placement work"
  tool: explore
  expect:
    - service.src.services.order_service.place_order
    - service.src.services.pricing.quote_total
  graded:
    service.src.services.order_service.place_order: 3
    service.src.services.pricing.quote_total: 2

- q: "how do we quote the total price for a cart"
  tool: explore
  expect:
    - service.src.services.pricing.quote_total
    - service.src.services.pricing.base_price
  graded:
    service.src.services.pricing.quote_total: 3
    service.src.services.pricing.base_price: 2

- q: "how does user registration work end to end, frontend to backend"
  tool: explore
  expect:
    - frontend.src.api.users.registerUser
    - service.src.services.auth.register_user
  graded:
    service.src.services.auth.register_user: 3
    frontend.src.api.users.registerUser: 2

- q: "how is an inbound payment webhook processed"
  tool: explore
  expect:
    - service.src.handlers.webhooks.handle_payment_succeeded
    - service.src.services.order_service.mark_order_paid
  graded:
    service.src.handlers.webhooks.handle_payment_succeeded: 3
    service.src.services.order_service.mark_order_paid: 2

- q: "how does the frontend checkout flow work"
  tool: explore
  expect:
    - frontend.src.app.checkout
    - frontend.src.state.cart.addItem
    - frontend.src.api.orders.placeOrder
  graded:
    frontend.src.app.checkout: 3
    frontend.src.api.orders.placeOrder: 2
    frontend.src.state.cart.addItem: 2

- q: "how is an order cancelled"
  tool: explore
  expect:
    - service.src.services.order_service.cancel_order
    - service.src.services.notifications.notify_order_cancelled

- q: "how does the observable state store notify its subscribers"
  tool: explore
  expect:
    - frontend.src.state.store.Store.setState
    - frontend.src.state.store.Store.subscribe

- q: "how does client-side order submission avoid a duplicate request"
  tool: explore
  expect:
    - frontend.src.api.orders.placeOrder
    - frontend.src.utils.idempotency.markIfNew

