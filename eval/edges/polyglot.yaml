# --- heuristic-limit cases (>=3, precision < 1.0 is expected) -----------

- caller: service.src.services.auth.register_user
  callee: service.src.models.user.new
  expected: heuristic
  note: >
    Same-name-different-module: vexus's indexer doesn't nest associated
    functions under their `impl` block (only free-standing definitions are
    captured), so `Order::new` and `User::new` both become indistinguishable
    flat symbols named `new` with the same arity. `register_user` clearly
    intends `User::new(...)`, but in the indexed corpus the resolver's
    lowest-id tie-break actually returns service.src.models.order.new
    instead — a wrong-module false positive.

- caller: service.src.handlers.orders.create_order_endpoint
  callee: service.src.utils.validation.validate
  expected: heuristic
  note: >
    Same-name-different-module *and* cross-language: `validate(sku)`
    intends this Rust sku validator, but `services::auth::validate`
    (Rust, session tokens) and frontend.src.utils.validation.validate (TS,
    a different language entirely) share the same bare name and arity.
    vexus resolves calls by name across the whole index regardless of
    source language, so in the indexed corpus this call actually resolves
    to the TS symbol — an honest illustration that whole-repo, per-language-
    blind resolution can cross language boundaries in ways that make no
    sense at runtime.

- caller: service.src.handlers.webhooks.handle_payment_succeeded
  callee: service.src.services.auth.validate
  expected: heuristic
  note: >
    The same three-way `validate` collision as above, from a different
    call site: this one intends services.auth.validate (session-token
    validation) but the indexed corpus's resolver again lands on the
    cross-language frontend.src.utils.validation.validate.

- caller: service.src.services.pricing.quote_total
  callee: service.src.services.pricing.apply
  expected: heuristic
  note: >
    Trait-object dispatch: `discount` is a `Box<dyn Discount>`, so
    `discount.apply(...)` is runtime-polymorphic between
    PercentageDiscount::apply and FlatDiscount::apply — a static call-graph
    can't know which impl a given call site reaches. Compounding this,
    both impls collapse onto the identical qualname
    service.src.services.pricing.apply (impl blocks aren't nested, so
    neither is distinguishable from the other by qualname alone). In the
    indexed corpus the resolver instead lands on
    service.src.services.pricing.Discount.apply — the abstract trait
    method signature, which has no executable body at all, arguably a
    worse outcome than picking either concrete impl.

