# Hand-verified caller/callee ground truth for eval/corpora/pyapp.
#
# Schema: caller, callee (qualnames), expected: resolved | heuristic.
# `resolved` pairs are real call relationships vexus's static resolver is
# expected to get right. `heuristic` pairs are also real (the caller
# genuinely reaches the callee, or is the one true intended target among
# several plausible ones) but are documented cases where vexus's name+arity
# resolution heuristic cannot reliably land on the correct symbol — because
# of a same-name collision elsewhere in the corpus, or genuine duck-typed/
# polymorphic dispatch a static analyzer can't see through. Their presence
# means edge_precision/edge_recall < 1.0 is the honest, expected outcome,
# not a bug in the metric.
#
# Every qualname was verified against a real `vexus index` run over this
# corpus (VEXUS_EMBEDDER=mock); the actual resolved-edge behavior quoted in
# the `note` fields below was read back from that index's `edges` table.

