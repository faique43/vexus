# --- heuristic-limit cases (>=3, precision < 1.0 is expected) -----------

- caller: app.dispatch_create
  callee: handlers.invoices.InvoiceHandler.create
  expected: heuristic
  note: >
    Duck-typed dispatch: `dispatch_create(handler, req)` calls
    `handler.create(req)` where `handler` can be any endpoint handler
    exposing `create(self, req)`. InvoiceHandler.create and
    UserHandler.create both match by name+arity, so a static call-graph
    can't know which one a given call site means. In the indexed corpus
    the same-file/id tie-break actually resolves this call to
    handlers.users.UserHandler.create instead (see the paired entry below)
    — both are equally "correct" ground truth, and vexus can only ever
    find one of them at a time.

- caller: app.dispatch_create
  callee: handlers.users.UserHandler.create
  expected: heuristic
  note: >
    The other equally-valid target for the same ambiguous call site above;
    this is the one vexus's resolver actually lands on (lowest symbol id
    among the name+arity candidates).

- caller: handlers.billing.BillingHandler.close
  callee: services.billing_service.close
  expected: heuristic
  note: >
    Same-name-different-module: the true call is
    `billing_service.close(req["period_id"])`, but `close` also names
    handlers.billing.BillingHandler.close itself (the caller's own method)
    and jobs.cleanup.close, both with the same arity. In the indexed
    corpus this is worse than a mere tie: the same-file-first tie-break
    resolves the call to handlers.billing.BillingHandler.close ITSELF (a
    self-referential false positive), missing the true external target
    entirely.

- caller: services.notification_service.notify_invoice_created
  callee: services.notification_service.EmailNotifier.send
  expected: heuristic
  note: >
    Polymorphic dispatch: `notifier` is duck-typed (EmailNotifier or
    SmsNotifier, or any future channel exposing `send(self, message)`), so
    `notifier.send(...)` can't be resolved to one concrete method by static
    analysis. vexus's same-file tie-break happens to land on
    EmailNotifier.send (see the paired entry below).

- caller: services.notification_service.notify_invoice_created
  callee: services.notification_service.SmsNotifier.send
  expected: heuristic
  note: >
    The other equally-valid target for the same polymorphic call site
    above; vexus's resolver never finds this one (EmailNotifier.send has
    the lower symbol id and always wins the same-file tie-break).
