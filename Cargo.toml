[workspace]
resolver = "2"
members = ["crates/vexus-core", "crates/vexus-index", "crates/vexus-cli", "crates/vexus-embed", "crates/vexus-mcp", "crates/vexus-watch", "crates/vexus-eval"]

[workspace.package]
edition = "2021"
version = "0.1.4"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
blake3 = "1"
tempfile = "3"
ureq = "2"
sha2 = "0.10"
notify = "8"
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
