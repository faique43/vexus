[workspace]
resolver = "2"
members = ["crates/vexus-core", "crates/vexus-index", "crates/vexus-cli", "crates/vexus-embed"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
blake3 = "1"
tempfile = "3"
