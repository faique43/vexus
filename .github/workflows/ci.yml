name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        # windows-latest joined the matrix when the writer lock moved to
        # std::fs::File::try_lock (flock on Unix, LockFileEx on Windows) —
        # real mutual exclusion on every platform, no stub.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      VEXUS_EMBEDDER: mock
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --workspace

  eval-gate:
    name: eval-gate (retrieval-metric ratchet)
    runs-on: ubuntu-latest
    env:
      VEXUS_EMBEDDER: mock
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Compares this run's mock-mode metrics against the committed
      # eval/baseline-mock.json; exits 1 (naming every regressed metric) if
      # any of the 7 retrieval metrics dropped more than 0.02 absolute in
      # any corpus or overall. Never runs --real (no model downloads in PR
      # CI) — see eval/README.md for the pre-release --real --check workflow.
      - run: cargo run --release -p vexus-eval -- check

  perf:
    name: perf (advisory)
    runs-on: ubuntu-latest
    # Advisory only: GH runner variance (and, currently, real algorithmic
    # variance in the incremental-update path — see bench/budgets.json's
    # comment in bench/budgets.json's sibling docs) mean this must never block a merge.
    # continue-on-error makes the job show a non-blocking neutral/red
    # indicator instead of failing the required checks.
    continue-on-error: true
    env:
      VEXUS_EMBEDDER: mock
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run perf harness (never --enforce; advisory only)
        run: |
          {
            echo '## vexus-eval perf (advisory — never blocks merge)'
            echo '```'
            cargo run --release -p vexus-eval -- perf
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
