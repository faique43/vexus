name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (must already exist)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners for every target — no cross-compilation. ort's
          # build script fetches a prebuilt ONNX Runtime for the host, so
          # cross-building would mean fetching for the wrong one.
          - { runner: macos-15, target: aarch64-apple-darwin }
          # No x86_64-apple-darwin: ort ships no prebuilt ONNX Runtime for
          # that target, so the build script fails there regardless of the
          # runner image. Adding it back means vendoring an ONNX Runtime
          # build or switching backends, not just restoring a matrix line.
          #
          # The Linux runners are pinned to the OLDEST supported image on
          # purpose. A glibc-linked binary runs on the build machine's glibc
          # and newer, never older, so building on ubuntu-24.04 produced
          # binaries requiring GLIBC_2.39 — dead on Ubuntu 22.04, Debian 12,
          # and RHEL 9 with an error that reads like a broken build. 22.04
          # drops the floor to 2.35. Do not "modernise" these to
          # ubuntu-latest; the glibc-floor step below fails the build if the
          # floor creeps up again.
          - { runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        # --locked so a release is built from the committed dependency
        # versions, not whatever resolves that day.
        run: cargo build --release --locked -p vexus-cli

      # A binary that needs a newer glibc than the user has fails at exec
      # with "version `GLIBC_2.xx' not found" and looks like a broken
      # release. Nothing else in CI would catch a runner bump raising it.
      - name: Check the glibc floor
        if: runner.os == 'Linux'
        shell: bash
        env:
          MAX_GLIBC: "2.35"
        run: |
          set -euo pipefail
          need="$(readelf -V target/release/vexus \
            | grep -oE 'GLIBC_2\.[0-9]+' | sort -u -V | tail -n 1)"
          echo "highest required: ${need:-none} (allowed: GLIBC_$MAX_GLIBC)"
          [ -n "$need" ] || exit 0
          if [ "$(printf '%s\n' "GLIBC_$MAX_GLIBC" "$need" | sort -V | tail -n 1)" != "GLIBC_$MAX_GLIBC" ]; then
            echo "::error::$need exceeds the GLIBC_$MAX_GLIBC floor — this binary will not run on Ubuntu 22.04 or Debian 12. Build on an older runner image." >&2
            exit 1
          fi

      - name: Package
        id: package
        shell: bash
        env:
          # Via env rather than direct `${{ }}` interpolation into the script
          # body, which would let a dispatch input inject shell.
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            version="${DISPATCH_TAG#v}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi

          # A tag that disagrees with Cargo.toml would ship an archive named
          # for one version containing a binary that reports another.
          grep -q "^version = \"$version\"" Cargo.toml || {
            echo "tag v$version does not match the workspace version in Cargo.toml" >&2
            exit 1
          }
          name="vexus-${version}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          strip target/release/vexus || true
          cp target/release/vexus "dist/$name/"
          cp README.md LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          echo "archive=dist/$name.tar.gz" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ steps.package.outputs.archive }}

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # One checksum file covering every archive: install.sh verifies the
      # archive it downloaded against this before unpacking anything.
      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
