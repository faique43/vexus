name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (must already exist)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners for every target — no cross-compilation. ort's
          # build script fetches a prebuilt ONNX Runtime for the host, so
          # cross-building would mean fetching for the wrong one.
          - { runner: macos-14, target: aarch64-apple-darwin }
          - { runner: macos-13, target: x86_64-apple-darwin }
          - { runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        # --locked so a release is built from the committed dependency
        # versions, not whatever resolves that day.
        run: cargo build --release --locked -p vexus-cli

      - name: Package
        id: package
        shell: bash
        env:
          # Via env rather than direct `${{ }}` interpolation into the script
          # body, which would let a dispatch input inject shell.
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            version="${DISPATCH_TAG#v}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi

          # A tag that disagrees with Cargo.toml would ship an archive named
          # for one version containing a binary that reports another.
          grep -q "^version = \"$version\"" Cargo.toml || {
            echo "tag v$version does not match the workspace version in Cargo.toml" >&2
            exit 1
          }
          name="vexus-${version}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          strip target/release/vexus || true
          cp target/release/vexus "dist/$name/"
          cp README.md LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          echo "archive=dist/$name.tar.gz" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ steps.package.outputs.archive }}

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # One checksum file covering every archive: install.sh verifies the
      # archive it downloaded against this before unpacking anything.
      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
