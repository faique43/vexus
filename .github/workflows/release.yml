name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (must already exist)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}${{ matrix.variant && format(' ({0})', matrix.variant) || '' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Full builds run on native runners — ort's build script fetches a
          # prebuilt ONNX Runtime for the build target, and only these
          # targets have one. ubuntu-24.04 is the OLDEST image the Linux
          # full builds can use: the prebuilt runtime is compiled against
          # glibc 2.38+ and references __isoc23_strtol, so ubuntu-22.04
          # fails at link time rather than producing a more portable
          # binary. The glibc-floor step pins each leg's documented floor
          # so a runner-image jump can't raise it silently.
          - { runner: macos-15, target: aarch64-apple-darwin, max_glibc: "" }
          - { runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu, max_glibc: "2.39" }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, max_glibc: "2.39" }
          # Windows became buildable when the writer lock moved to
          # std::fs::File::try_lock (LockFileEx there); ort ships prebuilt
          # CPU runtimes for both Windows targets. Packaged as .zip with a
          # vexus.exe inside; installed via install.ps1.
          - { runner: windows-latest, target: x86_64-pc-windows-msvc, max_glibc: "" }
          - { runner: windows-11-arm, target: aarch64-pc-windows-msvc, max_glibc: "" }
          # Structural-only legs (`--no-default-features`): the ONNX
          # runtime is compiled out, which frees these targets from ort's
          # prebuilt-binary constraint — Intel macOS (no runtime at all)
          # and glibc 2.35 (ubuntu-22.04). Keyword+graph search only;
          # install.sh picks these when it detects an incompatible host.
          #
          # No musl leg: compiling ort out is not enough there. sqlite-vec's
          # C source uses the BSD-only u_int8_t/u_int16_t/u_int64_t
          # typedefs, which musl does not provide, so the build fails in
          # its build script regardless of feature flags. Adding musl back
          # means patching or replacing sqlite-vec, not restoring a line.
          #
          # The Intel-mac leg cross-compiles on the arm64 runner (fine
          # without ort — clang handles -arch x86_64) and skips the smoke
          # run rather than betting on Rosetta being present.
          - { runner: macos-15, target: x86_64-apple-darwin, variant: structural, flags: --no-default-features, skip_smoke: true, max_glibc: "" }
          - { runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu, variant: structural, flags: --no-default-features, max_glibc: "2.35" }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Build
        # --locked so a release is built from the committed dependency
        # versions, not whatever resolves that day. Explicit --target on
        # every leg so the binary path is uniform (and the Intel-mac leg
        # genuinely cross-compiles).
        run: cargo build --release --locked -p vexus-cli --target ${{ matrix.target }} ${{ matrix.flags }}

      # A binary that needs a newer glibc than the user has fails at exec
      # with "version `GLIBC_2.xx' not found" and looks like a broken
      # release. 2.39 is what ubuntu-24.04 produces and what the README
      # promises; this catches a newer runner image pushing it higher
      # without anyone noticing. It is a drift alarm, not an aspiration —
      # see the matrix comment for why the floor cannot simply be lowered.
      - name: Check the glibc floor
        if: matrix.max_glibc != ''
        shell: bash
        env:
          MAX_GLIBC: ${{ matrix.max_glibc }}
        run: |
          set -euo pipefail
          need="$(readelf -V target/${{ matrix.target }}/release/vexus \
            | grep -oE 'GLIBC_2\.[0-9]+' | sort -u -V | tail -n 1)"
          echo "highest required: ${need:-none} (allowed: GLIBC_$MAX_GLIBC)"
          [ -n "$need" ] || exit 0
          if [ "$(printf '%s\n' "GLIBC_$MAX_GLIBC" "$need" | sort -V | tail -n 1)" != "GLIBC_$MAX_GLIBC" ]; then
            echo "::error::$need exceeds the documented GLIBC_$MAX_GLIBC floor. The runner image probably moved. Either pin it back or update the floor in the README, CONTRIBUTING and CHANGELOG to match." >&2
            exit 1
          fi

      # A packaged binary that links but crashes at load (the exact failure
      # class static ONNX Runtime linking produces) would otherwise ship
      # unnoticed — no step here ever executed the artifact before this.
      # Mock embedder: no model download in CI, and it exercises exactly
      # what a structural/keyword run does at the user's machine.
      - name: Smoke test the binary
        if: ${{ !matrix.skip_smoke }}
        shell: bash
        env:
          VEXUS_EMBEDDER: mock
        run: |
          set -euo pipefail
          bin=target/${{ matrix.target }}/release/vexus
          [ "$RUNNER_OS" = "Windows" ] && bin="$bin.exe"
          "$bin" --version
          mkdir -p smoke/src
          printf 'def top_helper():\n    return 1\n' > smoke/a.py
          printf 'fn main() { helper(); }\nfn helper() {}\n' > smoke/src/lib.rs
          printf 'export function ui(): number { return 2; }\n' > smoke/app.ts
          "$bin" index smoke
          "$bin" status smoke | tee smoke_status.txt
          grep -q "index: 3 files" smoke_status.txt
          grep -Eq " [1-9][0-9]* symbols" smoke_status.txt

      - name: Package
        id: package
        shell: bash
        env:
          # Via env rather than direct `${{ }}` interpolation into the script
          # body, which would let a dispatch input inject shell.
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            version="${DISPATCH_TAG#v}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi

          # A tag that disagrees with Cargo.toml would ship an archive named
          # for one version containing a binary that reports another.
          grep -q "^version = \"$version\"" Cargo.toml || {
            echo "tag v$version does not match the workspace version in Cargo.toml" >&2
            exit 1
          }
          # Structural artifacts carry a suffix so install.sh can pick them
          # deliberately and nobody mistakes one for a full build.
          name="vexus-${version}-${{ matrix.target }}"
          if [ -n "${{ matrix.variant }}" ]; then
            name="$name-${{ matrix.variant }}"
          fi
          mkdir -p "dist/$name"
          bindir="target/${{ matrix.target }}/release"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "$bindir/vexus.exe" "dist/$name/"
            cp README.md LICENSE "dist/$name/"
            (cd dist && 7z a -tzip "$name.zip" "$name" > /dev/null)
            echo "archive=dist/$name.zip" >> "$GITHUB_OUTPUT"
          else
            strip "$bindir/vexus" || true
            cp "$bindir/vexus" "dist/$name/"
            cp README.md LICENSE "dist/$name/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
            echo "archive=dist/$name.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v7
        with:
          # target alone would collide: x86_64-unknown-linux-gnu ships both
          # a full and a structural artifact.
          name: ${{ matrix.target }}${{ matrix.variant && '-' || '' }}${{ matrix.variant }}
          path: ${{ steps.package.outputs.archive }}

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # One checksum file covering every archive: install.sh / install.ps1
      # verify the archive they downloaded against this before unpacking
      # anything.
      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.tar.gz *.zip > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          generate_release_notes: true
