[package]
name = "vexus-mcp"
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
default = ["onnx"]
onnx = ["vexus-embed/onnx", "vexus-watch/onnx"]

[dependencies]
anyhow.workspace = true
vexus-core = { path = "../vexus-core" }
vexus-embed = { path = "../vexus-embed", default-features = false }
vexus-watch = { path = "../vexus-watch", default-features = false }
rmcp = { version = "3.0.0-beta.2", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }

# Not yet used by any tool in this crate (the `status` tool takes no
# parameters), but every later tool (search/open/callers/...) needs a
# schemars-derived `Parameters<T>` struct per rmcp's tool macro, so these are
# declared now to match the dependency shape those tools need.
schemars = "1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile.workspace = true
