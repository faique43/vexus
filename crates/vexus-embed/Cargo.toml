[package]
name = "vexus-embed"
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
# Default builds carry the real ONNX embedding runtime. `--no-default-features`
# produces the *structural-only* build: keyword+graph search, no vectors —
# the escape hatch for targets ort ships no prebuilt runtime for (Intel
# macOS, glibc < 2.39, musl). MockEmbedder and the download/manifest module
# stay unconditional so tests and model metadata work in both shapes.
default = ["onnx"]
onnx = ["dep:ort", "dep:tokenizers", "dep:ndarray"]

[dependencies]
anyhow.workspace = true
blake3.workspace = true
ureq.workspace = true
sha2.workspace = true
# ort's default feature set, with tls-native swapped for tls-rustls: the
# native-tls default drags openssl-sys into the build-dependency graph (via
# ort-sys's ureq downloader), which makes `cargo install` fail on any Linux
# host without libssl-dev/pkg-config. Verify with `grep -c openssl
# Cargo.lock` — NOT `cargo tree --target`, which only filters normal deps and
# resolves build-deps for the host.
ort = { version = "2.0.0-rc.12", optional = true, default-features = false, features = [
    "std",
    "ndarray",
    "tracing",
    "download-binaries",
    "tls-rustls",
    "copy-dylibs",
    "api-24",
] }
tokenizers = { version = "0.23", optional = true, default-features = false, features = ["onig"] }
ndarray = { version = "0.17", optional = true }
vexus-core = { path = "../vexus-core" }

[dev-dependencies]
tempfile.workspace = true
