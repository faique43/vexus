[package]
name = "vexus-cli"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "vexus"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
blake3.workspace = true
clap = { version = "4", features = ["derive"] }
vexus-core = { path = "../vexus-core" }
vexus-embed = { path = "../vexus-embed" }
vexus-index = { path = "../vexus-index" }
vexus-mcp = { path = "../vexus-mcp" }

[dev-dependencies]
tempfile.workspace = true
assert_cmd = "2"
predicates = "3"
serde_json = "1"
rmcp = { version = "3.0.0-beta.2", features = ["client", "transport-child-process"] }
tokio = { version = "1", features = ["full"] }
