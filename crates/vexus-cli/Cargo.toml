[package]
name = "vexus-cli"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "vexus"
path = "src/main.rs"

[features]
# Structural-only builds (`--no-default-features`) compile the ONNX
# runtime out entirely — see crates/vexus-embed/Cargo.toml.
default = ["onnx"]
onnx = ["vexus-embed/onnx", "vexus-mcp/onnx", "vexus-watch/onnx"]

[dependencies]
anyhow.workspace = true
blake3.workspace = true
clap = { version = "4", features = ["derive"] }
# preserve_order: `init` rewrites a user's .mcp.json in place — re-sorting
# their keys alphabetically on every merge would be gratuitous churn.
serde_json = { version = "1", features = ["preserve_order"] }
vexus-core = { path = "../vexus-core" }
vexus-embed = { path = "../vexus-embed", default-features = false }
vexus-index = { path = "../vexus-index" }
vexus-mcp = { path = "../vexus-mcp", default-features = false }
vexus-watch = { path = "../vexus-watch", default-features = false }

[dev-dependencies]
tempfile.workspace = true
assert_cmd = "2"
predicates = "3"
serde.workspace = true
serde_yaml.workspace = true
rmcp = { version = "3.0.0-beta.2", features = ["client", "transport-child-process"] }
tokio = { version = "1", features = ["full"] }
